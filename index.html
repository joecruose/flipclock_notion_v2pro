<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notion Tall Fixed Clock</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">

  <style>
    /* DYNAMIC VARIABLES */
    :root {
      /* The original default colors */
      --bg-top: #2a2a2a; 
      --bg-bottom: #111111;
      --text-color: #ffffff; 
    }

    /* 1. LAYOUT RESET */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; 
      background-color: transparent;
      font-family: 'Oswald', sans-serif; 
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 2. WRAPPER */
    #scaler {
      width: 264px;
      height: 195px;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-origin: center center; 
    }

    .clock-container {
      display: flex;
      gap: 4px; 
    }

    /* 3. CARDS */
    .card {
      position: relative;
      width: 130px; 
      height: 195px; 
      
      /* Pure color on top, darkened shadow on bottom */
      background: linear-gradient(to bottom, var(--bg-top) 50%, var(--bg-bottom) 50%);
      
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* 4. NUMBERS */
    .number {
      font-family: 'Oswald', sans-serif; 
      font-size: 100px; 
      font-weight: 700; 
      line-height: 1;
      letter-spacing: 0px; 
      z-index: 1;
      font-variant-numeric: tabular-nums;
      transform: scaleY(1.10); 
      padding-bottom: 10px; 
      
      /* Exact text color */
      color: var(--text-color);
    }

    /* 5. SPLIT LINE */
    .card::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      background-color: rgba(0,0,0,0.8);
      z-index: 5;
    }

    /* 6. LABELS */
    .label {
      position: absolute;
      bottom: 14px;
      font-family: 'Helvetica Neue', sans-serif; 
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      z-index: 6;
      letter-spacing: 0.5px;

      /* Makes labels match the text color, but slightly faded so they don't clash */
      color: color-mix(in srgb, var(--text-color) 70%, transparent);
    }
    .label.left { left: 16px; }
    .label.right { right: 16px; }

  </style>
</head>
<body>

  <div id="scaler">
    <div class="clock-container">
      <div class="card">
        <div class="number" id="hour">00</div>
        <div class="label left" id="ampm">AM</div>
      </div>
      <div class="card">
        <div class="number" id="minute">00</div>
        <div class="label right" id="day">SUN</div>
      </div>
    </div>
  </div>

  <script>
/* SECURE DECODING LOGIC */
    function applyCustomColors() {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      if (!token) {
        document.body.innerHTML = '<div style="color: #808080; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px;">🔒 Valid configuration token required.</div>';
        return false;
      }

      try {
        const decoded = JSON.parse(atob(token));
        
        if (decoded.c1 && decoded.c2) {
          // Decodes the Base-36 string back into a standard hex color
          const bgHex = parseInt(decoded.c1, 36).toString(16).padStart(6, '0');
          const textHex = parseInt(decoded.c2, 36).toString(16).padStart(6, '0');

          document.documentElement.style.setProperty('--bg-top', `#${bgHex}`);
          document.documentElement.style.setProperty('--bg-bottom', `color-mix(in srgb, #${bgHex} 75%, black)`);
          document.documentElement.style.setProperty('--text-color', `#${textHex}`);
          return true;
        } else {
          throw new Error("Corrupted Token");
        }
      } catch (e) {
        document.body.innerHTML = '<div style="color: #808080; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px;">⚠️ Invalid or corrupted token.</div>';
        return false;
      }
    }
    
    // Only run the clock if the token passes the security check
    const isAuthorized = applyCustomColors();
    
    if (isAuthorized) {
      setInterval(updateClock, 1000);
      updateClock();
      window.addEventListener('resize', resizeClock);
      resizeClock();
    }
    
    applyCustomColors();

    /* CLOCK LOGIC */
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      let minutes = now.getMinutes();
      const dayIndex = now.getDay();
      
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12; 
      
      const strHours = hours < 10 ? '0' + hours : hours;
      const strMinutes = minutes < 10 ? '0' + minutes : minutes;
      
      const days = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
      
      document.getElementById('hour').textContent = strHours;
      document.getElementById('minute').textContent = strMinutes;
      document.getElementById('ampm').textContent = ampm;
      document.getElementById('day').textContent = days[dayIndex];
    }

    /* RESIZE LOGIC */
    function resizeClock() {
      const scaler = document.getElementById('scaler');
      const baseWidth = 264; 
      const baseHeight = 195;
      const availableWidth = window.innerWidth;
      const availableHeight = window.innerHeight;
      
      const scaleX = availableWidth / baseWidth;
      const scaleY = availableHeight / baseHeight;
      
      const scale = Math.min(scaleX, scaleY) * 0.98; 
      
      scaler.style.transform = `scale(${scale})`;
    }

    setInterval(updateClock, 1000);
    updateClock();

    window.addEventListener('resize', resizeClock);
    resizeClock();
  </script>

</body>
</html>
